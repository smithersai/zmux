name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            zig_target: x86_64-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
          - name: macos-arm64
            runner: macos-latest
            zig_target: aarch64-macos
          - name: macos-x64
            runner: macos-15-intel
            zig_target: x86_64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      # Build and run the test suite natively on the host runner. The release
      # build below cross-compiles with -Dtarget, but tests must run on the
      # host to actually execute, so this step intentionally omits -Dtarget.
      - name: Run tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe

      # Package each binary together with the LICENSE into a .tar.gz, and emit a
      # per-asset .sha256 sidecar. Per-asset sidecars are used (instead of one
      # combined SHA256SUMS) because each matrix entry runs on its own runner and
      # cannot see the other jobs' archives to build a single aggregate file.
      - name: Package assets
        run: |
          cp zig-out/bin/zmuxd zmuxd
          cp zig-out/bin/zmux-connect zmux-connect
          mkdir -p dist
          tar -czf "dist/zmuxd-${{ matrix.name }}.tar.gz" zmuxd LICENSE
          tar -czf "dist/zmux-connect-${{ matrix.name }}.tar.gz" zmux-connect LICENSE
          cd dist
          shasum -a 256 "zmuxd-${{ matrix.name }}.tar.gz" > "zmuxd-${{ matrix.name }}.tar.gz.sha256"
          shasum -a 256 "zmux-connect-${{ matrix.name }}.tar.gz" > "zmux-connect-${{ matrix.name }}.tar.gz.sha256"

      - name: Smoke test and verify release version
        working-directory: dist
        env:
          ASSET_TARGET: ${{ matrix.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          shasum -a 256 -c "zmuxd-${ASSET_TARGET}.tar.gz.sha256" "zmux-connect-${ASSET_TARGET}.tar.gz.sha256"
          version=$(sed -nE 's/^pub const version = "([^"]+)";$/\1/p' ../src/protocol.zig)
          package_version=$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)",$/\1/p' ../build.zig.zon)
          test -n "$version"
          test "$version" = "$package_version"
          if [[ "$EVENT_NAME" == push ]]; then
            test "$RELEASE_TAG" = "v$version"
          fi
          awk -v version="$version" 'index($0, "## [" version "]") == 1 { found = 1 } END { exit !found }' ../CHANGELOG.md

          smoke_dir=$(mktemp -d "$RUNNER_TEMP/zmux-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "zmuxd-${ASSET_TARGET}.tar.gz" -C "$smoke_dir"
          tar -xzf "zmux-connect-${ASSET_TARGET}.tar.gz" -C "$smoke_dir"
          test "$("$smoke_dir/zmuxd" --version)" = "zmuxd $version"
          test "$("$smoke_dir/zmux-connect" --version)" = "zmux-connect $version"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zmux-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zmux-*
          path: dist
          merge-multiple: true

      - name: Verify all platform assets
        working-directory: dist
        run: |
          for target in linux-x64 linux-arm64 macos-arm64 macos-x64; do
            for binary in zmuxd zmux-connect; do
              test -s "$binary-$target.tar.gz"
              shasum -a 256 -c "$binary-$target.tar.gz.sha256"
            done
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          fail_on_unmatched_files: true
