name: Release and Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_docs:
        description: Force republishing docs, wiki, llms.txt, and Lighthouse audit report
        type: boolean
        default: true

concurrency:
  group: release-and-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Merging from Smithers Cloud to GitHub main automatically:
# 1. Publishes updated docs, llms.txt, Engineering Wiki, Protocol Inspector,
#    and live Lighthouse Backpressure Audit Report to GitHub Pages.
# 2. When src/protocol.zig + build.zig.zon bump to an unreleased version (or a
#    v* tag is pushed), qualifies via ci.yml, builds all four platform tarballs
#    with SHA-256 checksums, smoke-tests each binary, tags vX.Y.Z, and creates
#    the GitHub Release with CHANGELOG.md notes.
jobs:
  plan:
    name: Plan release and docs publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      should_publish_docs: ${{ steps.plan.outputs.should_publish_docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release and docs plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^pub const version = "([^"]+)";$/\1/p' src/protocol.zig)
          package_version=$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)",$/\1/p' build.zig.zon)
          test -n "$version"
          test "$version" = "$package_version"
          tag="v$version"

          should_release="false"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            test "${{ github.ref_name }}" = "$tag"
            should_release="true"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              should_release="true"
            fi
          fi

          should_publish_docs="false"
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_publish_docs="true"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "should_publish_docs=$should_publish_docs" >> "$GITHUB_OUTPUT"
          echo "Plan: version=$version tag=$tag should_release=$should_release should_publish_docs=$should_publish_docs"

  qualify:
    needs: [plan]
    if: needs.plan.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: [plan]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            zig_target: x86_64-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
          - name: macos-arm64
            runner: macos-latest
            zig_target: aarch64-macos
          - name: macos-x64
            runner: macos-15-intel
            zig_target: x86_64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Run native tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe

      - name: Package assets
        run: |
          cp zig-out/bin/zmux zmux
          cp zig-out/bin/zmuxd zmuxd
          cp zig-out/bin/zmux-connect zmux-connect
          cp zig-out/lib/libzmux.a libzmux.a
          cp zig-out/include/zmux.h zmux.h
          mkdir -p dist
          tar -czf "dist/zmux-${{ matrix.name }}.tar.gz" zmux zmuxd zmux-connect LICENSE
          tar -czf "dist/zmuxd-${{ matrix.name }}.tar.gz" zmuxd LICENSE
          tar -czf "dist/zmux-connect-${{ matrix.name }}.tar.gz" zmux-connect LICENSE
          tar -czf "dist/libzmux-${{ matrix.name }}.tar.gz" libzmux.a zmux.h LICENSE
          cd dist
          for asset in \
            "zmux-${{ matrix.name }}.tar.gz" \
            "zmuxd-${{ matrix.name }}.tar.gz" \
            "zmux-connect-${{ matrix.name }}.tar.gz" \
            "libzmux-${{ matrix.name }}.tar.gz"; do
            shasum -a 256 "$asset" > "${asset}.sha256"
          done

      - name: Smoke test and verify release version
        working-directory: dist
        env:
          ASSET_TARGET: ${{ matrix.name }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          shasum -a 256 -c \
            "zmux-${ASSET_TARGET}.tar.gz.sha256" \
            "zmuxd-${ASSET_TARGET}.tar.gz.sha256" \
            "zmux-connect-${ASSET_TARGET}.tar.gz.sha256" \
            "libzmux-${ASSET_TARGET}.tar.gz.sha256"
          version=$(sed -nE 's/^pub const version = "([^"]+)";$/\1/p' ../src/protocol.zig)
          package_version=$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)",$/\1/p' ../build.zig.zon)
          test -n "$version"
          test "$version" = "$package_version"
          test "$RELEASE_TAG" = "v$version"
          awk -v version="$version" 'index($0, "## [" version "]") == 1 { found = 1 } END { exit !found }' ../CHANGELOG.md

          smoke_dir=$(mktemp -d "$RUNNER_TEMP/zmux-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "zmux-${ASSET_TARGET}.tar.gz" -C "$smoke_dir"
          tar -xzf "libzmux-${ASSET_TARGET}.tar.gz" -C "$smoke_dir"
          test "$("$smoke_dir/zmux" --version)" = "zmux $version"
          test "$("$smoke_dir/zmuxd" --version)" = "zmuxd $version"
          test "$("$smoke_dir/zmux-connect" --version)" = "zmux-connect $version"
          "$smoke_dir/zmux" doctor --json | grep -q "\"cliVersion\":\"$version\""
          test -s "$smoke_dir/libzmux.a"
          test -s "$smoke_dir/zmux.h"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zmux-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [plan, build, qualify]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zmux-*
          path: dist
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify all platform assets, generate Homebrew formula, and extract release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            for target in linux-x64 linux-arm64 macos-arm64 macos-x64; do
              for binary in zmux zmuxd zmux-connect libzmux; do
                test -s "$binary-$target.tar.gz"
                shasum -a 256 -c "$binary-$target.tar.gz.sha256"
              done
            done
            cat *.sha256 | sort -k2 > SHA256SUMS
          )
          node scripts/generate-homebrew.mjs --version "$VERSION" --checksums dist/SHA256SUMS --out dist/zmux.rb
          test -s dist/zmux.rb
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { found=1; next } /^## \[/ && found { exit } found { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
            dist/zmux.rb
          fail_on_unmatched_files: true

  docs-build:
    name: Build Docs, Wiki, llms.txt, and Lighthouse Audit
    needs: [plan]
    if: needs.plan.outputs.should_publish_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise toolchain (Zig)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Uphill Lighthouse audit
        uses: wevm/uphill@main
        continue-on-error: true

      - name: Build static docs, llms.txt, wiki, and audit report
        env:
          SMITHERS_TRUST_LEVEL: trusted
        run: |
          node scripts/build-docs.mjs
          test -s dist/site/index.html
          test -s dist/site/llms.txt
          test -s dist/site/audit/index.html
          test -s dist/site/audit/report.md
          test -s dist/site/wiki/index.html
          test -s dist/site/history/index.html
          test -s dist/site/playground/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  docs-deploy:
    name: Deploy Docs to GitHub Pages
    needs: [docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
