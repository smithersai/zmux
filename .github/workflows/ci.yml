name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every gate is a target in PACKAGE.ts or .smithers/PACKAGE.ts.
# Trust boundary:
# - Untrusted runs (PRs, fork contributors, local sandboxes) are encouraged and
#   hydrate from the shared https://build.smithers.sh object store read-only
#   (SMITHERS_CACHE_READ_TOKEN only). They can never publish cache or skip gates.
# - Trusted runs (push to main on controlled runners / Smithers Cloud sandboxes)
#   hold SMITHERS_CACHE_WRITE_TOKEN and publish verified results and artifacts.
jobs:
  ci:
    name: smthrs ci //... (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Live PTY and UNIX-socket chaos fuzzers are exclusive-tier targets.
            exclusive: "--include-exclusive"
          - os: macos-latest
            exclusive: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins Zig 0.17.1; WORKSPACE.ts resolves zig through it.
      - name: Setup mise toolchain
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Install smthrs
        run: npm install --global --ignore-scripts --no-audit --no-fund smthrs@1.0.0-rc.16

      - name: Restore Smithers action cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .smithers/cache
          key: smthrs-${{ runner.os }}-${{ github.sha }}
          restore-keys: smthrs-${{ runner.os }}-

      - name: Every target
        run: smthrs ci '//...' ${{ matrix.exclusive }} --verbose --results-file "$RUNNER_TEMP/smthrs-results.json"
        env:
          SMITHERS_TRUST_LEVEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'trusted' || 'untrusted' }}
          SMITHERS_CACHE_NAMESPACE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_WRITE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SMITHERS_CACHE_WRITE_TOKEN || '' }}

      - name: Test foreign UID protection
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -o pipefail
          sudo env ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zmux-root-global-cache" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zmux-root-cache" \
            NO_COLOR=1 "$(command -v zig)" build test-integration -Dintegration-filter=foreign_ \
            --summary all 2>&1 | tee "$RUNNER_TEMP/zmux-foreign-uid.log"
          grep -Eq '2/2 tests passed([;[:space:]]|$)' "$RUNNER_TEMP/zmux-foreign-uid.log"

      - name: Benchmark report
        if: success()
        run: |
          smthrs run //:bench --verbose
          cat .benchmarks/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload smthrs results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smthrs-results-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/smthrs-results.json
            .benchmarks/
            dist/site/
          if-no-files-found: ignore

  musl:
    name: Test on Alpine (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Run unit and integration tests on musl
        run: |
          zig_dir=$(dirname "$(readlink -f "$(command -v zig)")")
          docker run --rm \
            -v "$zig_dir:/opt/zig:ro" -v "$GITHUB_WORKSPACE:/src" \
            -w /src alpine:3.23 \
            /opt/zig/zig build test -Dtarget=x86_64-linux-musl --summary all
