name: Uphill

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    name: Uphill Lighthouse Backpressure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise toolchain (Zig)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run Uphill
        uses: wevm/uphill@main

      - name: Publish Lighthouse audit summary
        if: always()
        env:
          SMITHERS_TRUST_LEVEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'trusted' || 'untrusted' }}
          SMITHERS_CACHE_NAMESPACE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trunk' }}
        run: |
          node .smithers/scripts/render-pr-audit.mjs >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f .uphill/report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat .uphill/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zmux-uphill-lighthouse-${{ github.run_attempt }}
          path: |
            .uphill/report.html
            .uphill/report.json
            .uphill/report.md
          if-no-files-found: ignore
